<div class="card shadow-sm mb-4">
    <div class="card-header bg-warning text-dark">
        <h5 class="mb-0">📚 پیشنهاد مطالعه</h5>
    </div>
    <div class="card-body">
        <ul class="mb-0">
            {% for item in objective_report %}
                {% if item.percentage < 60 %}
                <li class="text-danger mb-2">
                    <strong>مرور:</strong> {{ item.objective.name }}
                    <span class="badge bg-danger">{{ item.percentage }}٪</span>
                </li>
                {% endif %}
            {% empty %}
                <li class="text-muted">پیشنهاد خاصی وجود ندارد.</li>
            {% endfor %}
        </ul>
    </div>
</div>
