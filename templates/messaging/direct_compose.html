{% extends "base.html" %}

{% block title %}پیام جدید{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="mb-4">✉️ پیام جدید</h1>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            
            <div class="card shadow-sm">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">گیرنده *</label>
                            <select name="receiver" class="form-control" required>
                                <option value="">انتخاب کنید...</option>
                                {% for user_obj in users %}
                                <option value="{{ user_obj.id }}">
                                    {{ user_obj.get_full_name|default:user_obj.username }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">موضوع (اختیاری)</label>
                            <input type="text" name="subject" class="form-control" 
                                   placeholder="موضوع پیام...">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">متن پیام *</label>
                            <textarea name="text" class="form-control" rows="5" 
                                      placeholder="متن پیام..." required></textarea>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">
                            ارسال پیام
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
