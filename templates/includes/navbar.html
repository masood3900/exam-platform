<nav class="navbar navbar-expand-lg shadow-sm" 
     style="background: linear-gradient(135deg, #667eea, #764ba2);">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center text-white fw-bold" href="{% url 'core:home' %}">
            <span class="me-2" style="font-size: 32px;">🎓</span>
            <span>سنجه‌یار</span>
        </a>

        <div class="d-flex align-items-center gap-2">
            {% if user.is_authenticated %}
                <a href="{% url 'accounts:dashboard' %}" class="btn btn-light btn-sm rounded-pill px-3" style="color: #667eea;">
                    📊 داشبورد
                </a>
                <form method="post" action="{% url 'accounts:logout' %}" class="d-inline" onsubmit="return confirm('از حساب کاربری خود خارج می‌شوید؟')">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-sm rounded-pill px-3">
                        🚪 خروج
                    </button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="btn btn-light btn-sm rounded-pill px-3" style="color: #667eea;">
                    ورود
                </a>
                <a href="{% url 'accounts:register' %}" class="btn btn-light btn-sm rounded-pill px-3" style="color: #667eea;">
                    ثبت‌نام
                </a>
            {% endif %}
        </div>
    </div>
</nav>
