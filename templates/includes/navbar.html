
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="/"
        >
            سامانه آموزشی
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMain"
            aria-controls="navbarMain"
            aria-expanded="false"
            aria-label="باز کردن منو"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse"
            id="navbarMain"
        >

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="/"
                    >
                        خانه
                    </a>
                </li>

                {% if user.is_authenticated %}

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{% url 'messaging:inbox' %}"
                        >
                            💬 پیام‌ها
                        </a>
                    </li>

                {% endif %}

            </ul>

            <ul class="navbar-nav">

                {% if user.is_authenticated %}

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{{ dashboard_url }}"
                        >
                            داشبورد
                        </a>
                    </li>

                    <li class="nav-item">
                        <span class="nav-link">
                            {{ user.get_full_name|default:user.username }}
                        </span>
                    </li>

                    <li class="nav-item">

                        <form
                            method="post"
                            action="{% url 'accounts:logout' %}"
                            class="d-inline"
                        >

                            {% csrf_token %}

                            <button
                                type="submit"
                                class="nav-link btn btn-link"
                            >
                                خروج
                            </button>

                        </form>

                    </li>

                {% else %}

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{% url 'accounts:login' %}"
                        >
                            ورود
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{% url 'accounts:register' %}"
                        >
                            ثبت‌نام
                        </a>
                    </li>

                {% endif %}

            </ul>

        </div>

    </div>

</nav>
