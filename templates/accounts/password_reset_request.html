{% extends "base.html" %}

{% block title %}بازیابی رمز عبور{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5 text-center">
                    <span style="font-size: 60px;">🔑</span>
                    <h3 class="fw-bold mb-2">بازیابی رمز عبور</h3>
                    <p class="text-muted mb-4">ایمیل خود را وارد کنید</p>

                    <form method="post">
                        {% csrf_token %}
                        <input type="email" name="email" class="form-control form-control-lg rounded-3 mb-3" 
                               placeholder="example@gmail.com" required>
                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3">
                            ارسال لینک بازیابی
                        </button>
                    </form>

                    <a href="{% url 'accounts:login' %}" class="d-block mt-3 text-decoration-none">
                        بازگشت به ورود
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
