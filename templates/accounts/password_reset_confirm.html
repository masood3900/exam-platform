{% extends "base.html" %}

{% block title %}تغییر رمز عبور{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5 text-center">
                    <span style="font-size: 60px;">🔐</span>
                    <h3 class="fw-bold mb-2">رمز عبور جدید</h3>
                    <p class="text-muted mb-4">رمز جدید را وارد کنید</p>

                    {% if valid %}
                    <form method="post">
                        {% csrf_token %}
                        <input type="password" name="password1" class="form-control form-control-lg rounded-3 mb-3" 
                               placeholder="رمز جدید" required>
                        <input type="password" name="password2" class="form-control form-control-lg rounded-3 mb-3" 
                               placeholder="تکرار رمز جدید" required>
                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3">
                            تغییر رمز
                        </button>
                    </form>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
