{% extends "base.html" %}

{% block title %}
ثبت نام
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8 col-md-10">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                <h3 class="mb-0 text-center">
                    ثبت نام کاربر
                </h3>
            </div>

            <div class="card-body">

                <form method="post"
                      enctype="multipart/form-data"
                      novalidate>

                    {% csrf_token %}

                    {% for field in form %}

                        <div class="mb-3">

                            <label class="form-label">
                                {{ field.label }}
                            </label>

                            {{ field }}

                            {% if field.help_text %}
                                <div class="form-text">
                                    {{ field.help_text }}
                                </div>
                            {% endif %}

                            {% for error in field.errors %}
                                <div class="text-danger small">
                                    {{ error }}
                                </div>
                            {% endfor %}

                        </div>

                    {% endfor %}

                    <div class="d-grid">

                        <button class="btn btn-success btn-lg"
                                type="submit">

                            ثبت نام

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
