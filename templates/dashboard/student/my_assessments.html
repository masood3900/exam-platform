{% extends "base.html" %}

{% block title %}آزمون‌های من{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="mb-4">📝 آزمون‌های من</h1>
    
    <div class="row g-4">
        <!-- آزمون‌های رایگان -->
        <div class="col-md-6">
            <a href="{% url 'accounts:my-free-assessments' %}" class="text-decoration-none text-dark">
                <div class="card shadow-sm border-0 h-100" style="cursor: pointer; transition: all 0.3s;" 
                     onmouseover="this.style.transform='translateY(-5px)'" 
                     onmouseout="this.style.transform='translateY(0)'">
                    <div class="card-body text-center py-5">
                        <div class="fs-1 mb-3">🆓</div>
                        <h4>آزمون‌های رایگان</h4>
                        <p class="text-muted mb-0">مشاهده آزمون‌های رایگان ثبت‌نام شده</p>
                    </div>
                </div>
            </a>
        </div>
        
        <!-- آزمون‌های خریداری شده -->
        <div class="col-md-6">
            <a href="{% url 'accounts:my-paid-assessments' %}" class="text-decoration-none text-dark">
                <div class="card shadow-sm border-0 h-100" style="cursor: pointer; transition: all 0.3s;" 
                     onmouseover="this.style.transform='translateY(-5px)'" 
                     onmouseout="this.style.transform='translateY(0)'">
                    <div class="card-body text-center py-5">
                        <div class="fs-1 mb-3">💳</div>
                        <h4>آزمون‌های خریداری شده</h4>
                        <p class="text-muted mb-0">مشاهده آزمون‌های پرداخت شده</p>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>
{% endblock %}
