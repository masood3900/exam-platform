<div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                {% if request.user.profile.avatar %}
                    <img
                        src="{{ request.user.profile.avatar.url }}"
                        class="rounded-circle me-3"
                        width="70"
                        height="70"
                        style="object-fit:cover;">
                {% else %}
                    <img 
                        src="https://ui-avatars.com/api/?name={{ request.user.username }}&background=0d6efd&color=fff&size=128"
                        class="rounded-circle me-3">
                {% endif %}
                <div >
                    <h3 class="mb-1">
                         سلام
                        {{ request.user.first_name|default:request.user.username }}
                        👋
                    </h3>
                    <p class="text-muted mb-0">
                        خوش امدی 
                        امیدوارم امروز هم یک قدم به هدفت نزدیکتر شوی
                    </p>
                </div>

            </div>
            <div class="d-flex align-items-center gap-2">

                <a
                    href="{% url 'messaging:direct-inbox' %}" class="btn btn-outline-success""
                    class="btn btn-outline-success">

                    💬 پیام‌ها
                    {% if unread_message_count %}

                        <span class="badge bg-danger ms-1">
                            {{ unread_message_count }}
                        </span>

                    {% endif %}

                </a>
                <a
                  href="{% url 'accounts:profile' %}"
                  class="btn btn-outline-primary">
                  پروفایل
                </a>
                <form 
                    method="post"
                    action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-outline-danger">
                        خروج
                    </button>
                </form>

                

            </div>

        </div>

    </div>

</div>
