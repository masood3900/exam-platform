{% include "dashboard/components/header.html" %}

<div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
    <div>
        <h4 class="mb-1">✏️ داشبورد طراح سوال</h4>
        <p class="text-muted mb-0 small">
            🎯 موضوع‌های تحت طراحی:
            {% for topic in designer_topics %}
                <span class="badge bg-primary">{{ topic.name }}</span>
            {% empty %}
                <span class="text-muted">—</span>
            {% endfor %}
        </p>
    </div>
    <div class="d-flex gap-2 flex-wrap">
        {% if upper_manager %}
        <a href="{% url 'messaging:direct-conversation' user_id=upper_manager.user.id %}" class="btn btn-sm btn-outline-primary">
            💬 پیام به مدیر
        </a>
        {% endif %}
        <a href="{% url 'core:markdown-help' %}" target="_blank" class="btn btn-sm btn-outline-info">
            📚 راهنمای نوشتن
        </a>
        <a href="{% url 'accounts:question_designer:question-create' %}" class="btn btn-sm btn-primary">
            ➕ طراحی سوال
        </a>
    </div>
</div>
