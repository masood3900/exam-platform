{% extends "base.html" %}

{% block title %}نمودار درآمد{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="mb-4">📊 نمودار درآمد</h1>
    
    <div class="card shadow-sm">
        <div class="card-body">
            <canvas id="revenueChart" height="100"></canvas>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const ctx = document.getElementById('revenueChart').getContext('2d');
new Chart(ctx, {
    type: 'bar',
    data: {
        labels: {{ labels|safe }},
        datasets: [{
            label: 'درآمد (تومان)',
            data: {{ values|safe }},
            backgroundColor: 'rgba(40, 167, 69, 0.7)',
            borderColor: 'rgba(40, 167, 69, 1)',
            borderWidth: 1,
        }]
    },
    options: {
        responsive: true,
        scales: {
            y: {
                beginAtZero: true,
            }
        }
    }
});
</script>
{% endblock %}
