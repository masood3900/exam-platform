<div class="card shadow-sm mb-4">
    <div class="card-header bg-light">
        <h6 class="mb-0">👤 مدیر شما</h6>
    </div>
    <div class="card-body text-center">
        {% if upper_manager.avatar %}
            <img src="{{ upper_manager.avatar }}" class="rounded-circle mb-3" width="60" height="60" style="object-fit: cover;">
        {% else %}
            <img src="https://ui-avatars.com/api/?name={{ upper_manager.full_name }}&background={{ upper_manager.role_color }}&color=fff&size=128" 
                 class="rounded-circle mb-3" width="60" height="60">
        {% endif %}
        
        <span class="badge bg-{{ upper_manager.role_color }} mb-2">{{ upper_manager.role_label }}</span>
        <h6 class="mb-3">{{ upper_manager.full_name }}</h6>
        
        <a href="{% url 'messaging:direct-conversation' user_id=upper_manager.user.id %}" 
           class="btn btn-sm btn-outline-primary">
            💬 پیام
        </a>
    </div>
</div>
