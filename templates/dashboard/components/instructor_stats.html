<div class="row g-3 mb-4">


    <!-- دانش‌آموزان -->

    <div class="col-md-3">
        <a 
            href="{% url 'accounts:instructor-students' %}"
            class="text-decoration-none text-dark"
            >
            <div class="card shadow-sm border-0 h-100">

                <div class="card-body text-center">

                    <div class="fs-1 text-primary">
                    👨‍🎓
                    </div>

                    <h6 class="text-muted">
                    دانش‌آموزان
                    </h6>

                    <h3>
                        {{ stats.students_count }}
                    </h3>

                </div>

            </div>

        </a>


    </div>


    <!-- آزمون‌ها -->

    <div class="col-md-3">

        <div class="card shadow-sm border-0 h-100">

            <div class="card-body text-center">

                <div class="fs-1 text-success">
                    📝
                </div>

                <h6 class="text-muted">
                    آزمون‌ها
                </h6>

                <h3>
                    {{ stats.assessment_count }}
                </h3>

            </div>

        </div>

    </div>


    <!-- دفعات شرکت -->

    <div class="col-md-3">

        <div class="card shadow-sm border-0 h-100">

            <div class="card-body text-center">

                <div class="fs-1 text-warning">
                    📊
                </div>

                <h6 class="text-muted">
                    دفعات شرکت در آزمون
                </h6>

                <h3>
                    {{ stats.attempt_count }}
                </h3>

            </div>

        </div>

    </div>


    <!-- میانگین عملکرد -->

    <div class="col-md-3">

        <div class="card shadow-sm border-0 h-100">

            <div class="card-body text-center">

                <div class="fs-1 text-danger">
                    ⭐
                </div>

                <h6 class="text-muted">
                    میانگین عملکرد
                </h6>

                <h3>
                    {{ stats.average_percentage }}٪
                </h3>

            </div>

        </div>

    </div>


</div>
