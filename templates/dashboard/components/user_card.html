<div class="card user-card shadow-sm h-100">
    <div class="card-body text-center">
        {% if card_data.avatar %}
            <img src="{{ card_data.avatar }}" class="rounded-circle mb-3" width="80" height="80" style="object-fit: cover;">
        {% else %}
            <img src="https://ui-avatars.com/api/?name={{ card_data.full_name }}&background={{ card_data.role_color }}&color=fff&size=128"
                 class="rounded-circle mb-3" width="80" height="80">
        {% endif %}

        <span class="badge bg-{{ card_data.role_color }} mb-2">
            {{ card_data.role_label }}{% if card_data.group_name %} - {{ card_data.group_name }}{% endif %}
        </span>

        <h5 class="mb-1">{{ card_data.full_name }}</h5>

        <p class="text-muted small mb-1">سن: {{ card_data.age|default:"-" }}</p>
        <p class="text-muted small mb-3">عضویت: {{ card_data.date_joined|date:"Y/m/d" }}</p>

        <div class="d-flex gap-2 justify-content-center">
            <a href="{% url 'messaging:direct-conversation' user_id=card_data.user.id %}"
               class="btn btn-sm btn-outline-primary">💬</a>
            <button class="btn btn-sm btn-info" data-bs-toggle="modal" 
                    data-bs-target="#changeRoleModal{{ card_data.user.id }}">
                🔄
            </button>
            <form method="post" action="{% url 'accounts:user-delete' user_id=card_data.user.id %}" 
                  class="d-inline" onsubmit="return confirm('غیرفعال شود؟')">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-danger">🗑️</button>
            </form>
        </div>
    </div>
</div>
