{% include "dashboard/components/header.html" %}

<div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
    <div>
        <h4 class="mb-1">🔬 داشبورد مدیر علمی</h4>
        <p class="text-muted mb-0 small">
            📂 مسیر تحت مدیریت:
            {% for group in my_groups %}
                <span class="badge bg-primary">{{ group.name }}</span>
            {% empty %}
                <span class="text-muted">—</span>
            {% endfor %}
        </p>
    </div>
    <div class="d-flex gap-2 flex-wrap">
        <a href="{% url 'accounts:scientific_manager:user-directory' %}" class="btn btn-sm btn-outline-primary">
            👥 کاربران
        </a>
        <a href="{% url 'accounts:scientific_manager:scientific-manager-assessment-create' %}" class="btn btn-sm btn-primary">
            📝 ساخت آزمون
        </a>
    </div>
</div>
