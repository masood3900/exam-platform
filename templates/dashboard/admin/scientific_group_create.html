{% extends "base.html" %}

{% block title %}ساخت حوزه{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="mb-4">➕ ساخت حوزه جدید</h1>
            
            <div class="card shadow-sm">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">نام *</label>
                            {{ form.name }}
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">کد *</label>
                            {{ form.code }}
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">توضیحات</label>
                            {{ form.description }}
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">والد (برای رشته)</label>
                            {{ form.parent }}
                            <small class="text-muted">برای حوزه خالی بگذارید</small>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">ذخیره</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
